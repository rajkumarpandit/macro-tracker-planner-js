# This file was modified to include Firestore rules deployment
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting and Rules on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Build React App
        run: npm ci && npm run build
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MACRO_TRACKER_AND_PLANNER }}
          channelId: live
          projectId: macro-tracker-and-planner
      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project macro-tracker-and-planner --token "${{ secrets.FIREBASE_TOKEN }}"
